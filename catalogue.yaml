- name: install catalogue
  hosts: catalogue
  become: yes
  tasks:
  - name: disable nodejs
    command: dnf module disable nodejs -y

  - name: enable nodejs24
    command: dnf module enable nodejs:24 -y

  - name: install nodejs
    dnf:
      name: nodejs
      state: present

  - name: create roboshop system user
    user:
      name: roboshop
      create_home: false
      home: /app
      system: true
      shell: /sbin/nologin
      comment: "roboshop system user"

  