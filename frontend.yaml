- name: configure frontend
  hosts: frontend
  become: yes
  tasks:
  - name: enable nginx 1.26
    command: dnf module enable nginx:1.26 -y

  - name: isntall nginx
    dnf:
      name: nginx
      state: present

  - name: start and enable nginx
    service:
      name: nginx
      state: started
      enabled: yes

  - name: Find all content inside the directory
    ansible.builtin.find:
      paths: /usr/share/nginx/html
      recurse: true
      hidden: true
      file_type: any
    register: directory_contents

  - name: print directorey content
    debug:
      msg: "{{ directorey_contents }}"

  - name: delete the discovered countDocuments
    ansible.builtin.file:
      path: "{{ item.path }}"
      state: absent
    loop: "{{ directory_contents.files }}"